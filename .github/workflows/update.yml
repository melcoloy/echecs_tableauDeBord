name: Mise à jour des parties

on:
  schedule:
    - cron: "0 5 * * *"   # chaque jour à 5h UTC
  workflow_dispatch:       # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backend/fetch_games.py melcoloy
      - name: Commit si de nouvelles parties sont arrivées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des parties ($(date -u +%F))"
          git push