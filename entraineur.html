<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entraîneur d'ouvertures</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="trainer.css">
</head>
<body>
<main>
  <nav class="nav"><a href="index.html">Tableau de bord</a><a href="entraineur.html" aria-current="page">Entraîneur d'ouvertures</a><a href="jouer.html">Jouer contre le moteur</a></nav>
  <header class="top">
    <div>
      <p class="kicker">Entraîneur d'ouvertures</p>
      <h1 id="title">Chargement…</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="filters">
      <label class="period">Ouverture <select id="opening"></select></label>
      <div class="chips" role="group" aria-label="Mode">
        <button data-m="apprendre" aria-pressed="true">Apprendre</button>
        <button data-m="entrainement" aria-pressed="false">S'entraîner</button>
      </div>
    </div>
  </header>

  <div class="trainer">
    <div class="boardwrap">
      <div class="board" id="board" aria-label="Échiquier"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>

    <aside class="panel">
      <section class="block">
        <h2><span class="mv">1.</span> Coups joués</h2>
        <ol class="moves" id="moves"></ol>
      </section>
      <section class="block">
        <h2><span class="mv">2.</span> <span id="posTitle">Position</span></h2>
        <div id="posInfo"></div>
      </section>
      <section class="block">
        <h2><span class="mv">3.</span> Progression</h2>
        <div id="progress"></div>
        <div class="actions">
          <button class="btn" id="next">Nouvelle ligne</button>
          <button class="btn ghost" id="reset">Remettre à zéro</button>
        </div>
      </section>
    </aside>
  </div>

  <p class="hint credits">Statistiques : base de parties Lichess (blitz et rapide). Pièces « cburnett » de Colin M. L. Burnett, licence CC BY-SA 3.0.</p>
</main>

<script src="vendor/chess.js"></script>
<script src="trainer.js"></script>
</body>
</html>
